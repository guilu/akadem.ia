services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: akdemya
      POSTGRES_USER: ak_user
      POSTGRES_PASSWORD: ak_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    networks: 
      - cluster_network 

  api:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/akdemya
      SPRING_DATASOURCE_USERNAME: ak_user
      SPRING_DATASOURCE_PASSWORD: ak_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      JWT_SECRET: "cambia-esto-por-una-clave-larga-local"
    depends_on:
      - db
    ports:
      - "8080:8080"
    networks:
      - cluster_network

  web:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - api
    networks:
      - cluster_network

volumes:
  pgdata:
networks:
  cluster_network:
    external: true
