services:
  db:
    container_name: akademia-prod-db
    image: postgres:18
    environment:
      POSTGRES_DB: akademia
      POSTGRES_USER: ${AKADEMIA_DB_USER}
      POSTGRES_PASSWORD: ${AKADEMIA_DB_PASSWORD}
    ports:
      - "6543:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql
    networks:
      - prod_network

  api:
    container_name: akademia-prod-api
    image: akademia-api:1.1.0
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/akademia
      SPRING_DATASOURCE_USERNAME: ${AKADEMIA_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${AKADEMIA_DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_PROFILES_ACTIVE: prod
      SPRING_SQL_INIT_MODE: never
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - db
    ports:
      - "8082:8080"
    networks:
      - prod_network

  web:
    container_name: akademia-prod-web
    image: akademia-web:1.1.0
    environment:
      VITE_API_URL: https://akademia.diegobarrioh.dev
    ports:
      - "5173:3000"
    depends_on:
      - api
    networks:
      - prod_network

volumes:
  pgdata_prod:

networks:
  prod_network:
    driver: bridge
