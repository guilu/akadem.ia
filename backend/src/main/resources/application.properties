spring.application.name=akdemya-api
server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
# spring.jpa.defer-datasource-initialization=true
spring.flyway.enabled=${SPRING_LAYWAY_ENABLE:false}
spring.flyway.locations=classpath:db/migration
security.jwt.secret=${JWT_SECRET}

app.flashcards.learning-steps-minutes=1,10
app.flashcards.easy-interval-days=4
app.flashcards.review-again-relearn-minutes=10

# RAG - Source document storage
app.rag.storage-path=${RAG_STORAGE_PATH:/tmp/akademia-sources}
app.rag.chunk-size=${RAG_CHUNK_SIZE:1000}
app.rag.chunk-overlap=${RAG_CHUNK_OVERLAP:200}
app.rag.retrieval-top-k=${RAG_RETRIEVAL_TOP_K:8}

# AI provider (OpenAI by default)
app.ai.provider=${AI_PROVIDER:openai}
app.ai.api-key=${AI_API_KEY:}
app.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
app.ai.embedding-model=${AI_EMBEDDING_MODEL:text-embedding-3-small}
app.ai.chat-model=${AI_CHAT_MODEL:gpt-4o-mini}