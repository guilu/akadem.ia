spring.application.name=akdemya-api
server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
# spring.jpa.defer-datasource-initialization=true
spring.flyway.enabled=${SPRING_FLYWAY_ENABLE:false}
spring.flyway.locations=classpath:db/migration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
security.jwt.secret=${JWT_SECRET}

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Trust X-Forwarded-* headers so Spring constructs the correct redirect_uri
# (https://domain/login/oauth2/code/google) when running behind the nginx proxy.
server.forward-headers-strategy=framework

app.flashcards.learning-steps-minutes=1,10
app.flashcards.easy-interval-days=4
app.flashcards.review-again-relearn-minutes=10

# RAG - Source document storage
app.rag.storage-path=${RAG_STORAGE_PATH:/tmp/akademia-sources}
app.rag.chunk-size=${RAG_CHUNK_SIZE:1000}
app.rag.chunk-overlap=${RAG_CHUNK_OVERLAP:200}
app.rag.retrieval-top-k=${RAG_RETRIEVAL_TOP_K:8}

# AI - Groq (primary LLM provider, fast inference)
app.ai.groq.api-key=${GROQ_API_KEY:}
app.ai.groq.base-url=https://api.groq.com/openai/v1
app.ai.groq.chat-model=${GROQ_CHAT_MODEL:llama-3.3-70b-versatile}

# AI - OpenRouter (fallback LLM + embeddings; Groq has no embedding models)
app.ai.openrouter.api-key=${OPENROUTER_API_KEY:}
app.ai.openrouter.base-url=https://openrouter.ai/api/v1
app.ai.openrouter.chat-model=${OPENROUTER_CHAT_MODEL:meta-llama/llama-3.3-70b-instruct}
app.ai.openrouter.embedding-model=${OPENROUTER_EMBEDDING_MODEL:openai/text-embedding-3-small}
app.ai.openrouter.site-url=https://akademia.diegobarrioh.dev
app.ai.openrouter.app-name=Akademia