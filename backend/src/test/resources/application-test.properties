# H2 en memoria con compatibilidad PostgreSQL
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_UPPER=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway disabled in tests (schema generated by Hibernate ddl-auto)
spring.flyway.enabled=false

# Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT — fixed Base64 test secret (32 bytes decoded). Never use in production.
security.jwt.secret=dGVzdC1zZWNyZXQtZm9yLWp3dC1ub3QtZm9yLXByb2R1Y3Rpb24=
security.jwt.ttl-minutes=15

# Stripe — placeholder secrets for tests; webhook secret is exercised by WebhookControllerIT
stripe.secret-key=sk_test_dummy
stripe.webhook-secret=whsec_test_secret_12345

# Frontend URL used to build the email download link in tests
app.frontend-url=https://akademia.test

# Google OAuth2 — placeholder credentials so OAuth2ClientProperties validation passes.
# These are never exercised in tests (tests target API endpoints directly).
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret

# CORS / app config required by SecurityConfig at context boot
app.cors.allowed-origins=http://localhost:5173
app.cookie.secure=false

# Resend — empty values are fine, the port is mocked in any IT that exercises email
app.email.resend.api-key=test-resend-key
app.email.resend.from=test@akademia.test

# Products — local path for the catalog/storage; tests mock ProductFileStoragePort
app.products.storage-path=/tmp/akademia-products-test

# Silence Hibernate DDL and JPA lifecycle logs during tests
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.tool.schema=ERROR
logging.level.org.springframework.orm.jpa=ERROR
logging.level.org.springframework.orm.jpa.LocalContainerEntityManagerFactoryBean=ERROR

# Inicializaci�n SQL (cargar data.sql)
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# Si usas JPA y quieres que se creen las tablas antes del data.sql:
spring.jpa.defer-datasource-initialization=true

# (Opcional) Consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2