# H2 en memoria con compatibilidad PostgreSQL
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false

# Silence Hibernate DDL and JPA lifecycle logs during tests
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.tool.schema=WARN
logging.level.org.springframework.orm.jpa=WARN

# Inicializaci�n SQL (cargar data.sql)
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# Si usas JPA y quieres que se creen las tablas antes del data.sql:
spring.jpa.defer-datasource-initialization=true

# (Opcional) Consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2