server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' https: data:; connect-src 'self' https: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
    # HSTS — habilitar solo cuando HTTPS esté garantizado en el proxy upstream
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # All backend traffic goes through /api — this single rule covers:
    #   - REST API:              /api/**
    #   - OAuth2 authorization:  /api/oauth2/authorization/google
    #   - OAuth2 callback:       /api/login/oauth2/code/google
    # No separate /oauth2/ or /login/oauth2/ proxy rules needed.
    location /api/ {
        proxy_pass       http://api:8080/api/;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Pass the proto set by the upstream reverse proxy (e.g. Caddy/Traefik)
        # so Spring builds redirect_uri with https:// instead of http://.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $http_host;
    }

    # SPA fallback — all other paths serve index.html so React Router works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
