services:
  db:
    container_name: akademia-dev-db
    image: postgres:16
    environment:
      POSTGRES_DB: akdemya
      POSTGRES_USER: ak_user
      POSTGRES_PASSWORD: ak_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ak_user -d akdemya -h localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: 
      - cluster_network 

  api:
    container_name: akademia-dev-api
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/akdemya
      SPRING_DATASOURCE_USERNAME: ak_user
      SPRING_DATASOURCE_PASSWORD: ak_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_PROFILES_ACTIVE: dev
      SPRING_FLYWAY_ENABLE: true
      SPRING_FLYWAY_OUT_OF_ORDER: true
      SPRING_SQL_INIT_MODE: never
      JWT_SECRET: "akdemya-secret-key-please-change-me-32bytes"
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Set FRONTEND_URL=https://akademia.diegobarrioh.dev in .env for production.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - cluster_network

  web:
    container_name: akademia-dev-web
    build: ./frontend
    environment:
      VITE_API_URL: /api
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - cluster_network

volumes:
  pgdata:
networks:
  cluster_network:
    external: true
